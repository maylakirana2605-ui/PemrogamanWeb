<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>

                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Anggota Perpustakaan</h2>
            <form action="#" method="post">
                <p>
                    <label for="nim">NIM / ID Anggota:</label>
                    <input type="text" id="nim" name="nim" required>
                </p>
                <p>
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="prodi">Program Studi:</label>
                    <input type="text" id="prodi" name="prodi" required>
                </p>
                <p>
                    <label for="status">Status Keanggotaan:</label>
                    <select id="status" name="status">
                        <option value="Aktif">Aktif</option>
                        <option value="Nonaktif">Nonaktif</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan Anggota</button>
                    <button type="reset">Batal</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3</p>
    </footer>
</body>
