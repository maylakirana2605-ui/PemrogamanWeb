<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Data Buku</h2>
            <form action="#" method="post">
                <p>
                    <label for="judul">Judul Buku:</label>
                    <input type="text" id="judul" name="judul" required>
                </p>
                <p>
                    <label for="penulis">Penulis:</label>
                    <input type="text" id="penulis" name="penulis" required>
                </p>
                <p>
                    <label for="tahun">Tahun Terbit:</label>
                    <input type="number" id="tahun" name="tahun" required>
                </p>
                <p>
                    <label for="stok">Jumlah Stok:</label>
                    <input type="number" id="stok" name="stok" required>
                </p>
                <p>
                    <label for="status">Status Buku:</label>
                    <select id="status" name="status" required>
                        <option value="">-- Pilih Status --</option>
                        <option value="Tersedia">Tersedia</option>
                        <option value="Dipinjam">Dipinjam</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan Buku</button>
                    <button type="reset">Batal</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5</p>
    </footer>

    <script src="../assets/js/app.js"></script>
</body>
</html>
